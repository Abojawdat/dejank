name: dejank_meter
description: "The measuring half of dejank. Install both: flutter pub add dev:dejank_meter (in your app) and dart pub global activate dejank (the tool), for before/after numbers."
version: 0.2.0
homepage: https://abojawdat.github.io/dejank/
repository: https://github.com/Abojawdat/dejank/tree/main/dejank_meter
issue_tracker: https://github.com/Abojawdat/dejank/issues
topics: [performance, testing, flutter]

screenshots:
  - description: dejank measure before and after dejank fix on an Android phone. 93% fewer widget builds, 84% fewer slow frames.
    path: art/measure.png

environment:
  sdk: ^3.12.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
