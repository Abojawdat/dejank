<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404">
  <rect width="760" height="404" rx="14" fill="#0B1220"/>
  <circle cx="26" cy="24" r="6" fill="#EF4444"/><circle cx="46" cy="24" r="6" fill="#F59E0B"/><circle cx="66" cy="24" r="6" fill="#22C55E"/>
  <text x="380" y="29" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">example/slow_app on an Android phone, before and after dejank fix</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="28" y="72" fill="#64748B">$ <tspan fill="#38BDF8">dejank fix</tspan></text>
    <text x="28" y="98" fill="#E2E8F0">Fixed 4 problems in 2 files. 3 need a human, see `dejank scan`.</text>
    <text x="28" y="150" fill="#64748B">$ <tspan fill="#38BDF8">dejank measure integration_test/search_test.dart</tspan></text>
    <text x="28" y="176" fill="#64748B">search</text>
    <text x="420" y="176" fill="#64748B" text-anchor="end">before</text>
    <text x="520" y="176" fill="#64748B" text-anchor="end">now</text>
    <text x="28" y="202" fill="#E2E8F0">widget builds</text>
    <text x="420" y="202" fill="#E2E8F0" text-anchor="end">213,677</text>
    <text x="520" y="202" fill="#E2E8F0" text-anchor="end">14,051</text>
    <text x="544" y="202" fill="#22C55E">-93%</text>
    <text x="46" y="228" fill="#E2E8F0">ProductTile</text>
    <text x="420" y="228" fill="#E2E8F0" text-anchor="end">4,620</text>
    <text x="520" y="228" fill="#E2E8F0" text-anchor="end">240</text>
    <text x="544" y="228" fill="#22C55E">-95%</text>
    <text x="46" y="254" fill="#E2E8F0">HomeScreen</text>
    <text x="420" y="254" fill="#E2E8F0" text-anchor="end">42</text>
    <text x="520" y="254" fill="#E2E8F0" text-anchor="end">3</text>
    <text x="544" y="254" fill="#22C55E">-93%</text>
    <text x="28" y="280" fill="#E2E8F0">frames</text>
    <text x="420" y="280" fill="#E2E8F0" text-anchor="end">140</text>
    <text x="520" y="280" fill="#E2E8F0" text-anchor="end">143</text>
    <text x="544" y="280" fill="#64748B">+2%</text>
    <text x="46" y="306" fill="#E2E8F0">avg build</text>
    <text x="420" y="306" fill="#E2E8F0" text-anchor="end">22.9 ms</text>
    <text x="520" y="306" fill="#E2E8F0" text-anchor="end">7.7 ms</text>
    <text x="544" y="306" fill="#22C55E">-66%</text>
    <text x="46" y="332" fill="#E2E8F0">avg raster</text>
    <text x="420" y="332" fill="#E2E8F0" text-anchor="end">1.5 ms</text>
    <text x="520" y="332" fill="#E2E8F0" text-anchor="end">1.4 ms</text>
    <text x="544" y="332" fill="#22C55E">-8%</text>
    <text x="46" y="358" fill="#E2E8F0">slow frames</text>
    <text x="420" y="358" fill="#E2E8F0" text-anchor="end">43</text>
    <text x="520" y="358" fill="#E2E8F0" text-anchor="end">6</text>
    <text x="544" y="358" fill="#22C55E">-86%</text>
  </g>
</svg>
