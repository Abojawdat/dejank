name: dejank
description: Finds slow Flutter code and fixes it for you. For the full workflow, also add dejank_meter to your app (dev only) to get real before/after numbers.
version: 0.1.7
homepage: https://abojawdat.github.io/dejank/
repository: https://github.com/Abojawdat/dejank
issue_tracker: https://github.com/Abojawdat/dejank/issues
topics: [performance, lints, codemod, analyzer, flutter]

screenshots:
  - description: dejank scan, fix and measure on a demo shop app. On an Android phone, 93% fewer widget builds and 84% fewer slow frames.
    path: art/session.webp
  - description: dejank scan lists each slow spot with its impact and whether it can be fixed automatically.
    path: art/scan.png
  - description: dejank fix rewrites the safe ones and shows the diff.
    path: art/fix.png
  - description: dejank measure compares widget builds and frame times before and after.
    path: art/measure.png

environment:
  sdk: ^3.12.0

executables:
  dejank:
dependencies:
  analyzer: ^14.5.0
  args: ^2.7.0
  path: ^1.9.1
dev_dependencies:
  test: ^1.33.0
