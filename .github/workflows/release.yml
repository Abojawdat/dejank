name: release

# bump `version:` in pubspec.yaml or dejank_meter/pubspec.yaml, push to main, done

on:
  push:
    branches: [main]
    paths: [pubspec.yaml, dejank_meter/pubspec.yaml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: tag new versions and publish them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in . dejank_meter; do
            name=$(grep '^name:' $dir/pubspec.yaml | awk '{print $2}')
            version=$(grep '^version:' $dir/pubspec.yaml | awk '{print $2}')
            if [ "$dir" = . ]; then tag="v$version"; else tag="$name-v$version"; fi
            info=$(curl -s https://pub.dev/api/packages/$name)
            if ! echo "$info" | grep -q '"latest"'; then
              echo "::notice::$name isnt on pub.dev yet. Publish the first version by hand once (dart pub publish), then turn on automated publishing in the pub.dev admin tab."
              continue
            fi
            if echo "$info" | grep -q "\"version\":\"$version\""; then
              echo "$name $version is already on pub.dev"
              continue
            fi
            if ! git rev-parse "$tag" >/dev/null 2>&1; then
              git tag "$tag"
              git push origin "$tag"
            fi
            gh workflow run publish.yml --ref "$tag"
          done
